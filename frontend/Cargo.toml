[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true }
backend = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255" }
dioxus-icons = "0.1"
dioxus-code = { version = "0.1", default-features = false, features = ["macro", "lang-css"] }
palette = "0.7"
time = { version = "0.3", features = ["std", "macros"] }
window-vibrancy = { version = "0.8", optional = true }

# Windows-only: `DwmExtendFrameIntoClientArea` for the Mica backdrop (see `elements/window_effect.rs`).
# Same version `window-vibrancy` pins, so it reuses the one compiled crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_UI_Controls",
] }

[dev-dependencies]
dioxus-ssr = "0.7"

[features]
server = ["backend/server"]
desktop = ["dioxus/desktop", "dep:window-vibrancy"]

[lints]
workspace = true
