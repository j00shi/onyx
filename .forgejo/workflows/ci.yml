name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt + clippy)
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Uses scripts/fmt.sh so the vendored `ui/src/standard` directory is skipped.
      - name: Check formatting
        run: ./scripts/fmt.sh --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  styles:
    name: Styles (prettier + stylelint)
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check SCSS formatting
        run: npm run format:check

      - name: Lint SCSS
        run: npm run lint:style
